# Builds and releases the Awake tray app (Tauri) on tags vX.Y.Z.
# The CLI is released from the same tag by release.yml (cargo-dist), which
# uploads into the GitHub Release this workflow creates.
#
# Secrets / variables: see "Release secrets" in README.md.
name: Tray release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.release.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Check tag matches workspace version
        id: version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check updater public key is configured
        run: |
          if [ -z "${{ vars.TAURI_UPDATER_PUBKEY }}" ]; then
            echo "::error::Set the repository variable TAURI_UPDATER_PUBKEY (see README)"
            exit 1
          fi
      - name: Create draft release (idempotent)
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Reuse the release on re-runs. A new draft can take a moment to show
          # up in the list, so take its id from the create response instead.
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -F draft=true -F generate_release_notes=true \
              -f name="Awake $TAG" \
              -f body="Tray app installers (.dmg, .msi, .exe, .deb, .AppImage) and CLI installers for $TAG." \
              --jq .id)
          fi
          if [ -z "$id" ]; then
            echo "::error::Could not create or find the release for $TAG"
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
          # Oldest supported Ubuntu keeps the AppImage's glibc requirement low.
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: tray-${{ matrix.platform }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Tauri CLI
        working-directory: apps/awake-tray
        run: bun install --frozen-lockfile

      - name: Write CI config (updater key + endpoint for this repo)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/tauri.ci.json" <<EOF
          {
            "plugins": {
              "updater": {
                "pubkey": "${{ vars.TAURI_UPDATER_PUBKEY }}",
                "endpoints": ["https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"]
              }
            }
          }
          EOF

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing + notarization (ignored on other runners)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/awake-tray
          tauriScript: bun run tauri
          releaseId: ${{ needs.create-release.outputs.release-id }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config ${{ runner.temp }}/tauri.ci.json

  publish-cask:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Render cask from the released .dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*_universal.dmg" --dir dmg
          sha=$(sha256sum dmg/*.dmg | cut -d' ' -f1)
          scripts/render-cask.sh "$VERSION" "$sha" "$GITHUB_REPOSITORY" > awake-tray.rb
          cat awake-tray.rb
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Commit cask to tap
        run: |
          mkdir -p tap/Casks
          cp awake-tray.rb tap/Casks/awake-tray.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/awake-tray.rb
          git diff --cached --quiet || git commit -m "awake-tray ${{ needs.create-release.outputs.version }}"
          git push

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      # Version-less copies so the website can link to
      # releases/latest/download/<name> without knowing the version.
      - name: Upload installers under stable names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir stable && cd stable
          fetch() {
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$1" --output "$2"
          }
          fetch "*_universal.dmg"   Awake-macOS.dmg
          fetch "*_x64-setup.exe"   Awake-Windows-Setup.exe
          fetch "*_x64_en-US.msi"   Awake-Windows.msi
          fetch "*_amd64.deb"       Awake-Linux-amd64.deb
          fetch "*_amd64.AppImage"  Awake-Linux-x86_64.AppImage
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
