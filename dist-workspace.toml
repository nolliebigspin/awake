[workspace]
members = ["cargo:."]

# Config for 'dist' (CLI releases). The tray app is released by
# .github/workflows/tray-release.yml from the same tag.
[dist]
cargo-dist-version = "0.33.0"
ci = "github"
installers = ["shell", "powershell", "homebrew"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
install-path = "CARGO_HOME"
install-updater = false
# Build only awake-cli. Without this, dist runs `cargo build --workspace`, which
# also compiles the Tauri tray app and fails on Linux runners without GTK.
precise-builds = true
# Homebrew: formula `awake` in your tap (needs HOMEBREW_TAP_TOKEN).
tap = "nolliebigspin/homebrew-tap"
formula = "awake"
publish-jobs = ["homebrew"]
# tray-release.yml creates the GitHub Release; dist uploads into it.
create-release = false
pr-run-mode = "plan"
