[workspace]
members = ["cargo:."]

# Config for 'dist' (CLI releases). The tray app is released by
# .github/workflows/tray-release.yml from the same tag.
[dist]
cargo-dist-version = "0.33.0"
ci = "github"
installers = ["shell", "powershell", "homebrew", "npm"]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
install-path = "CARGO_HOME"
install-updater = false
# Homebrew: formula `awake` in your tap (needs HOMEBREW_TAP_TOKEN).
tap = "OWNER/homebrew-tap"
formula = "awake"
# npm: `awake`/`awake-cli` are taken, so publish as @<scope>/awake (needs NPM_TOKEN).
npm-scope = "@owner"
npm-package = "awake"
publish-jobs = ["homebrew", "npm"]
# tray-release.yml creates the GitHub Release; dist uploads into it.
create-release = false
pr-run-mode = "plan"
